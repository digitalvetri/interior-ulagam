# docker-compose.coolify.yml
#
# Coolify deployment — identical to the base docker-compose.yml except:
#   1. Caddy is removed (Coolify's built-in Traefik handles TLS + routing)
#   2. Internal services (postgres, redis, minio) do NOT publish host ports
#      — they're reachable only on the internal Docker network
#   3. The app IS the only public-facing service; Coolify routes your domain to it
#
# HOW TO DEPLOY IN COOLIFY:
#   1. Add a new Resource → "Docker Compose" → choose your GitHub repo
#   2. Set "Docker Compose file" to "docker-compose.coolify.yml"
#   3. Under "Domains", add your domain (e.g. https://crm.konstdesign.in)
#      and set the port to 3000
#   4. Add all environment variables listed in .env.coolify.example
#   5. Click Deploy
#
# See DEPLOY_COOLIFY.md for the full step-by-step guide.

name: interioos

x-owner-db-url: &owner-db-url
  DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

x-app-db-url: &app-db-url
  DATABASE_URL: postgres://interioos_app:${APP_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

x-storage-env: &storage-env
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: documents
  S3_QUOTES_BUCKET: quotes
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
  # S3_PUBLIC_URL must be your app's public HTTPS origin + /api/public
  # e.g. https://crm.konstdesign.in/api/public
  # The app proxies /api/public/* → MinIO internally, so no separate storage domain is needed.
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set S3_PUBLIC_URL to https://<your-domain>/api/public}

services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/documents &&
      mc mb --ignore-existing local/quotes &&
      mc anonymous set download local/quotes &&
      echo 'minio: buckets ready'
      "
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      <<: *owner-db-url
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: [*app-db-url, *storage-env]
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${APP_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${APP_URL:?}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-5}"
      CRON_TZ: ${CRON_TZ:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into CSP at build time — must match S3_PUBLIC_URL above.
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:?}
    ports:
      - "3000"
    environment:
      <<: [*app-db-url, *storage-env]
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${APP_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${APP_URL:?}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  minio_data:
